---
# Front matter comment to ensure Jekyll properly reads file.
---

<!DOCTYPE html>
{% assign html_lang = page.lang | default: "en-us" %}
<html lang="{{ html_lang }}">

{% include head.html %}

<body class="subPageBody">
  {% include header.html %}
  <main class="page-shell">
    <article class="page markdown-body">
      {{ content }}
    </article>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/analytics.js' | relative_url }}" defer></script>
  {% if page.scripts %}
    {% for script in page.scripts %}
  <script src="{{ script | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}
</body>

</html>
